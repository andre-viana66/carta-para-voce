<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <!-- OBRIGATÓRIO para ser responsivo: faz o celular usar a largura real da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>telinha - principal</title>

    <!-- Todo o visual (incluindo a fonte e o fundo) fica no style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <!--
            "janela" é a caixa que encolhe e cresce conforme a tela.
            Tudo que está dentro dela (gatinho, texto, botões) é posicionado
            em PORCENTAGEM em relação a ela, por isso acompanha o tamanho.
        -->
        <div class="janela" id="janela">

            <!-- Imagem principal: começa como o ícone da carta e vira a "janelinha" ao clicar -->
            <img src="imagens/icon_carta.gif" class="carta" id="carta" alt="Carta fechada. Clique para abrir">

            <!-- Sem atributo src: o JS preenche ao abrir a carta (o CSS esconde enquanto estiver vazio) -->
            <img class="gatinho" id="gatinho" alt="Gatinho">

            <!-- Texto da pergunta (preenchido pelo JS) -->
            <h2 class="secundario_titulo" id="secundario_titulo"></h2>

            <!-- Botões Sim e Não (as imagens são colocadas pelo JS) -->
            <img class="botao_sim" id="botao_sim" alt="Sim">
            <img class="botao_nao" id="botao_nao" alt="Não">
        </div>

        <!-- Título de boas-vindas, fora da janela para não interferir nas posições em % -->
        <h1 class="inicial_titulo" id="inicial_titulo">❤ Uma carta para você ❤</h1>

    </main>

    <script src="script.js"></script>
</body>
</html>
